<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% block title %}
      Admin Panel | RM Stock Tracker
    {% endblock %}
  </title>

  <!-- Bootstrap CSS and Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- Block Style -->
  {% block style %} {% endblock %}
</head>

<body class="bg-light">

  <!-- Admin Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold">Admin</span>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#adminNavbar"
        aria-controls="adminNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="adminNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="{{ url_for('admin.index') }}">
              Dashboard
            </a>
          </li>
        </ul>

        <div class="d-flex gap-2">
          <a
            href="{{ url_for('home') }}"
            class="btn btn-outline-light btn-sm"
          >
            Back to site
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Block Content -->
  <main role="main">
    {% block content %} {% endblock %}
  </main>

  <!-- Bootstrap JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous" defer></script>

  <!-- Block Script -->
  {% block script %} {% endblock %}

</body>
</html>
