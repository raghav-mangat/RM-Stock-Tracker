<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ subject or "RM Stock Tracker" }}</title>
    <style>
      /* Container */
      .email-container {
        background-color: #fafafa;
        color: #212529;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        max-width: 600px;
        margin: 32px auto;
        border: 1px solid #dadce0;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        padding: 24px 20px;
        box-sizing: border-box;
      }

      /* Header */
      .email-header {
        text-align: center;
        padding-bottom: 20px;
        border-bottom: 1px solid #dadce0;
        margin-bottom: 24px;
      }
      .header-img {
        width: 40px;
        height: 40px;
        display: inline-block;
        margin-right: 6px;
        vertical-align: middle;
      }
      .header-text {
        font-size: 24px;
        font-weight: 600;
        margin: 0;
        display: inline-block;
        vertical-align: middle;
      }
      .header-link {
        text-decoration: none;
      }

      /* Content */
      .text-center {
        text-align: center;
      }
      .my-3 {
        margin: 24px 0;
      }
      .fw-semibold {
        font-weight: 600;
      }

      /* Button */
      .btn {
        display: inline-block;
        background-color: #0d6efd;
        color: #ffffff !important;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 6px;
        font-weight: 500;
        font-size: 16px;
        text-align: center;
      }
      .btn-danger {
        background-color: #dc3545;
      }

      /* Footer */
      .email-footer {
        text-align: center;
        border-top: 1px solid #dadce0;
        padding-top: 16px;
        margin-top: 24px;
      }
      .email-footer p {
        font-size: 12px;
        color: #585f66;
        line-height: 1.4;
        margin: 6px 0;
      }
      .social-icons {
        margin-top: 12px;
      }
      .social-icons a {
        text-decoration: none;
      }
      .social-icons img {
        width: 28px;
        height: 28px;
        margin: 0 6px;
        vertical-align: middle;
      }
      .footer-links {
        margin: 6px 0;
      }
      .footer-links a {
        font-size: 12px;
        font-weight: 600;
        color: #0d6efd;
        text-decoration: none;
        margin: 0 4px;
      }
      .footer-links a:hover {
        text-decoration: underline;
      }

      /* Responsive */
      @media (max-width: 600px) {
        .email-container {
          width: 100%;
          margin: 0 auto;
          padding: 20px 16px;
        }
        .btn {
          display: block;
          width: 100%;
          padding: 14px 0px;
        }
      }

      {% block style %} {% endblock %}
    </style>
  </head>
  <body>
    <div class="email-container">
      <div class="email-header">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
          <tr>
            <td align="center">
              <a href="{{ url_for('home', _external=True) }}"
                 style="color: inherit;"
                 class="header-link">
                <img src="https://www.rmstocktracker.com/static/assets/email_icons/logo.png"
                     alt="RM Stock Tracker Logo"
                     class="header-img"
                />
                <span class="header-text">
                  RM Stock Tracker
                </span>
              </a>
            </td>
          </tr>
        </table>
      </div>

      <div class="email-content">
        {% block content %}{% endblock %}
      </div>

      <div class="email-footer">
        <p>This email was sent by RM Stock Tracker.</p>

        <div class="footer-links">
          <a href="{{ url_for('privacy', _external=True) }}">Privacy</a>
          <a href="{{ url_for('terms', _external=True) }}">Terms</a>
        </div>

        <p>Follow Us</p>
        <div class="social-icons">
          <a href="https://www.instagram.com/raghav_mangat04/" target="_blank">
            <img src="https://www.rmstocktracker.com/static/assets/email_icons/black/instagram.png"
                 alt="Instagram"
            />
          </a>
          <a href="https://github.com/raghav-mangat/" target="_blank">
            <img src="https://www.rmstocktracker.com/static/assets/email_icons/black/github.png"
                 alt="GitHub"
            />
          </a>
          <a href="https://www.linkedin.com/in/raghav-mangat-784686334/" target="_blank">
            <img src="https://www.rmstocktracker.com/static/assets/email_icons/black/linkedin.png"
                 alt="LinkedIn"
            />
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
