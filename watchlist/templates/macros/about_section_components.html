{% macro section_header(heading, text) %}
  <div class="row text-center mb-5">
    <div class="col">
      <h2 class="fw-semibold">{{ heading }}</h2>
      <p class="text-muted mt-2">
        {{ text }}
      </p>
    </div>
  </div>
{% endmacro %}

{% macro feature_card(heading, text, icon) %}
  <div class="col-md-4">
    <div class="card h-100 border-0 shadow-sm">
      <div class="card-body">
        <div class="mb-3 text-primary">
          <i class="bi {{ icon }} fs-3"></i>
        </div>
        <h5 class="card-title">{{ heading }}</h5>
        <p class="card-text text-muted">
          {{ text }}
        </p>
      </div>
    </div>
  </div>
{% endmacro %}

{% macro workflow_card(heading, text) %}
  <div class="col-md-6">
    <div class="p-4 bg-light rounded-3 h-100">
      <h5 class="fw-semibold">{{ heading }}</h5>
      <p class="text-muted mb-0">
        {{ text }}
      </p>
    </div>
  </div>
{% endmacro %}
