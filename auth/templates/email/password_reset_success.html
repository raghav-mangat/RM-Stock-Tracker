{% extends "email/base_email.html" %}

{% block content %}

<p>Hi {{ user.first_name }},</p>
<p>Your password has been successfully changed. If this wasn’t you, please reset it immediately to protect your account:</p>
<div class="text-center my-3">
  <a href="{{ url_for('auth.reset_password_request', _external=True) }}" class="btn btn-danger">
    Reset Password Again
  </a>
</div>

{% endblock %}
