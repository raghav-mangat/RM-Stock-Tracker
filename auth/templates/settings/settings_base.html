{% from "macros/auth_fields.html" import settings_field, form_field, password_field %}

{% extends "base.html" %}

{% block content %}
  <section class="container my-3">
    <div class="row">

      <div class="col-md-3 mb-3">
        <div class="list-group">
          <a class="list-group-item list-group-item-action
             {% if active_tab == 'profile' %}active{% endif %}"
             href="{{ url_for('auth.settings_profile') }}">
            Profile
          </a>
          <a class="list-group-item list-group-item-action
             {% if active_tab == 'account' %}active{% endif %}"
             href="{{ url_for('auth.settings_account') }}">
            Account
          </a>
        </div>
      </div>

      <div class="col-md-9">
        {% block settings_content %} {% endblock %}
      </div>

    </div>

    {% block settings_modal %} {% endblock %}

  </section>
{% endblock %}

{% block script %}
  <script>
    // Passing the password policy to JS script
    const PASSWORD_POLICY = {{ PASSWORD_POLICY | tojson }};
  </script>

  <script src="{{ url_for('auth.static', filename='js/auth.js') }}" type="text/javascript" defer></script>
  <script src="{{ url_for('auth.static', filename='js/settings.js') }}" type="text/javascript" defer></script>
{% endblock %}
