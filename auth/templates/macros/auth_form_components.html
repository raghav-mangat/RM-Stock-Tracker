{% macro form_heading(text) %}
    <h3 class="text-center mb-3">{{ text }}</h3>
    <div class="border-top"></div>
{% endmacro %}

{% macro form_separator() %}
  <div class="d-flex align-items-center my-3">
    <div class="flex-grow-1 border-top"></div>
    <span class="mx-3 text-muted small fw-semibold">OR</span>
    <div class="flex-grow-1 border-top"></div>
  </div>
{% endmacro %}

{% macro form_agreement() %}
  <p class="small text-muted text-center mt-3">
    By continuing, you agree to our
    <a href="{{ url_for('privacy') }}" class="text-primary fw-semibold">Privacy Policy</a> and
    <a href="{{ url_for('terms') }}" class="text-primary fw-semibold">Terms of Service</a>.
  </p>
{% endmacro %}

{% macro form_email(email) %}
  <div class="border rounded px-3 py-2 bg-light d-flex align-items-center justify-content-between gap-2">
    <span class="fw-semibold text-body flex-grow-1 text-break">
      {{ email }}
    </span>
    <span class="badge bg-success-subtle text-success border flex-shrink-0">
      Verified
    </span>
  </div>
{% endmacro %}
