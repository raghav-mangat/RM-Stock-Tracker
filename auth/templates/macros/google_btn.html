{% macro google_btn() %}
{# Using the "Continue with Google" button from official Google assets #}
<div class="d-flex justify-content-center mt-4">
  <a href="{{ url_for('auth.google_signin', next=request.args.get('next')) }}"
     class="google-signin-link">
    <img
      src="{{ url_for('static', filename='assets/google_signin/google-button.svg') }}"
      alt="Continue with Google"
      class="google-signin-btn">
  </a>
</div>
{% endmacro %}
